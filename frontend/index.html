<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Snapshot: beautiful screenshots in seconds</title>
    <meta
      name="description"
      content="Turn your screenshots into ready-to-share visuals: gradient backgrounds, macOS window frame, high-resolution PNG export. Free, no account, 100% in your browser."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://valtielchan.github.io/snapshot/" />
    <meta name="theme-color" content="#ef8783" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Snapshot" />
    <meta property="og:title" content="Snapshot: beautiful screenshots in seconds" />
    <meta
      property="og:description"
      content="Gradient backgrounds, macOS window frame, high-resolution PNG export. Free, no account, 100% in your browser."
    />
    <meta property="og:url" content="https://valtielchan.github.io/snapshot/" />
    <meta property="og:image" content="https://valtielchan.github.io/snapshot/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Snapshot: beautiful screenshots in seconds" />
    <meta
      name="twitter:description"
      content="Gradient backgrounds, macOS window frame, high-resolution PNG export. Free, no account, 100% local."
    />
    <meta name="twitter:image" content="https://valtielchan.github.io/snapshot/og-image.png" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Snapshot",
        "url": "https://valtielchan.github.io/snapshot/",
        "description": "Screenshot beautifier: gradient backgrounds, window frame, high-resolution PNG export. Free and 100% client-side.",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Web",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "inLanguage": "en"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
